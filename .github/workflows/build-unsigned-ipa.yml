name: Build Unsigned IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Compile iPhone App
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Extract source
        run: unzip -q FocusTask-GitHub-Source.zip -d source

      - name: Build unsigned IPA
        run: |
          chmod +x source/scripts/build-unsigned-ipa.sh
          source/scripts/build-unsigned-ipa.sh "$RUNNER_TEMP/output"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: FocusTask-unsigned-ipa
          path: ${{ runner.temp }}/output/FocusTask-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
